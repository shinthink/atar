[project]
name = "atar-tui"
version = "0.1.0"
description = "ATAR — Textual TUI"
requires-python = ">=3.12"
dependencies = [
    "atar-core",
    "textual>=0.70",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atar_tui"]
