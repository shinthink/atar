[project]
name = "atar-provider-anthropic"
version = "0.1.0"
description = "ATAR — Anthropic Messages API provider"
requires-python = ">=3.12"
dependencies = [
    "atar-models",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atar_provider_anthropic"]
