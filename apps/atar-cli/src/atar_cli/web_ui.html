<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATAR — Clarity in Complexity</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --primary: #4FC3F7;
    --text: #e6edf3;
    --dim: #8b949e;
    --user-msg: #1a2332;
    --error: #f85149;
    --success: #3fb950;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: linear-gradient(135deg, #1a56db, #7e3ff2, #db2777);
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    text-align: center;
    letter-spacing: 0.5px;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 12px;
    line-height: 1.5;
    font-size: 14px;
    animation: fadeIn 0.2s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    align-self: flex-end;
    background: var(--primary);
    color: #000;
    border-bottom-right-radius: 4px;
  }
  .msg.assistant {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg.error {
    align-self: flex-start;
    background: #3d1117;
    border: 1px solid var(--error);
    color: var(--error);
  }
  .msg.info {
    align-self: center;
    background: transparent;
    color: var(--dim);
    font-size: 12px;
    border: none;
    text-align: center;
  }
  #input-area {
    padding: 12px 20px;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  #input:focus { border-color: var(--primary); }
  #send {
    background: var(--primary);
    color: #000;
    border: none;
    border-radius: 8px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  #send:hover { opacity: 0.9; }
  #send:disabled { opacity: 0.4; cursor: default; }
  .spinner { display: inline-block; width: 8px; height: 8px; background: var(--dim); border-radius: 50%; animation: pulse 0.8s infinite; margin-left: 8px; }
  @keyframes pulse { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
  .status { display: flex; align-items: center; gap: 16px; padding: 4px 20px; font-size: 11px; color: var(--dim); border-top: 1px solid var(--border); }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--success); }
  pre { background: var(--bg); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 4px 0; }
  code { background: rgba(255,255,255,0.08); padding: 1px 4px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>

<header>ATAR — Clarity in Complexity</header>

<div id="messages">
  <div class="msg info">Type a message and press Enter to start.</div>
</div>

<div id="input-area">
  <input id="input" type="text" placeholder="Ask ATAR..." autofocus>
  <button id="send" onclick="send()">Send</button>
</div>

<div class="status">
  <span class="dot" id="status-dot"></span>
  <span id="status-text">idle</span>
  <span id="status-tokens"></span>
</div>

<script>
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('send');
  const statusDot = document.getElementById('status-dot');
  const statusText = document.getElementById('status-text');
  const statusTokens = document.getElementById('status-tokens');

  let turns = 0;

  function addMsg(role, text) {
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.innerHTML = text.replace(/\n/g, '<br>');
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
    return div;
  }

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    sendBtn.disabled = true;
    statusDot.style.background = '#f0883e';
    statusText.textContent = 'thinking...';

    addMsg('user', text);
    const assistDiv = addMsg('assistant', '');

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let fullText = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        const lines = chunk.split('\n');
        for (const line of lines) {
          if (!line.startsWith('data: ')) continue;
          const data = JSON.parse(line.slice(6));
          if (data.type === 'delta') {
            fullText += data.text;
            assistDiv.textContent = fullText;
            messages.scrollTop = messages.scrollHeight;
          } else if (data.type === 'done') {
            turns++;
          } else if (data.type === 'error') {
            assistDiv.className = 'msg error';
            assistDiv.textContent = data.error;
          }
        }
      }
    } catch (e) {
      const errDiv = addMsg('error', 'Connection failed: ' + e.message);
    }

    sendBtn.disabled = false;
    statusDot.style.background = '#3fb950';
    statusText.textContent = 'idle';
    statusTokens.textContent = turns + ' turns';
    input.focus();
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  });
</script>
</body>
</html>
