[project]
name = "atar-cli"
version = "0.1.0"
description = "ATAR — CLI entry point"
requires-python = ">=3.12"
dependencies = [
    "atar-core",
    "atar-security",
    "atar-provider-anthropic",
    "atar-tools",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atar_cli"]
