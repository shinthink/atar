[project]
name = "atar-agent"
version = "0.7.0"
description = "ATAR — Clarity in Complexity. Autonomous terminal AI agent with real-time tool execution, streaming responses, and persistent sessions."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "shinthink" }]
keywords = ["ai-agent", "terminal", "tui", "cli", "automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Terminals",
]

dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "anyio>=4.0",
    "typer>=0.12",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "atar-models",
    "atar-protocols",
    "atar-core",
    "atar-storage",
    "atar-cli",
    "atar-tui",
    "atar-security",
    "atar-provider-anthropic",
    "atar-provider-deepseek",
    "atar-provider-openai",
    "atar-provider-openrouter",
    "atar-provider-zai",
    "atar-provider-custom",
    "atar-tools",
    "prompt-toolkit>=3.0.53",
    "keyring>=25.7.0",
]

[tool.uv.sources]
atar-models = { workspace = true }
atar-protocols = { workspace = true }
atar-core = { workspace = true }
atar-storage = { workspace = true }
atar-cli = { workspace = true }
atar-tui = { workspace = true }
atar-tools = { workspace = true }
atar-security = { workspace = true }
atar-provider-anthropic = { workspace = true }
atar-provider-deepseek = { workspace = true }
atar-provider-openai = { workspace = true }
atar-provider-openrouter = { workspace = true }
atar-provider-zai = { workspace = true }
atar-provider-custom = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
tui = [
    "textual>=0.70",
]
all = [
    "atar[tui,dev]",
]

[project.scripts]
atar = "atar_cli.main:app"
atar-agent = "atar_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "apps/atar-cli/src/atar_cli",
    "apps/atar-tui/src/atar_tui",
    "packages/atar-core/src/atar_core",
    "packages/atar-models/src/atar_models",
    "packages/atar-protocols/src/atar_protocols",
    "packages/atar-tools/src/atar_tools",
    "packages/atar-storage/src/atar_storage",
    "packages/atar-security/src/atar_security",
    "providers/atar-provider-deepseek/src/atar_provider_deepseek",
    "providers/atar-provider-openai/src/atar_provider_openai",
    "providers/atar-provider-anthropic/src/atar_provider_anthropic",
    "providers/atar-provider-openrouter/src/atar_provider_openrouter",
    "providers/atar-provider-zai/src/atar_provider_zai",
    "providers/atar-provider-custom/src/atar_provider_custom",
]

[tool.uv.workspace]
members = [
    ".",
    "apps/*",
    "packages/atar-models",
    "packages/atar-protocols",
    "packages/atar-core",
    "packages/atar-storage",
    "packages/atar-tools",
    "packages/atar-security",
    "providers/*",
]

[tool.uv]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "textual-dev>=1.0",
]

[tool.ruff]
target-version = "py312"
line-length = 200

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E701", "E702"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "contract: marks tests as contract tests",
    "e2e: marks end-to-end tests",
    "security: marks security tests",
    "provider: marks provider compliance tests",
    "tool: marks tool compliance tests",
    "tui: marks TUI snapshot tests",
]

[tool.coverage.run]
source = ["packages", "apps", "providers", "tools"]
omit = ["*/tests/*", "*/test_*"]

[tool.coverage.report]
fail_under = 64
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
